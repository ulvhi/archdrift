<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="1" y="1" width="898" height="478" rx="14" fill="#fbfbfd" stroke="#e3e3e8"/>
  <text x="40" y="46" font-size="21" font-weight="700" fill="#2b2b30">archdrift · supported diagram shape</text>
  <text x="40" y="72" font-size="13" fill="#7a7a85">Component + flow (C4 container level): boxes are components, arrows are interactions, numbers are execution order.</text>

  <!-- arrowhead -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/>
    </marker>
  </defs>

  <!-- service -->
  <rect x="60" y="212" width="200" height="60" rx="11" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="160" y="248" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a3a5c">ms-example-service</text>

  <!-- Oracle cylinder -->
  <path d="M610,120 v44 a100,11 0 0 0 200,0 v-44" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <ellipse cx="710" cy="120" rx="100" ry="11" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="710" y="150" text-anchor="middle" font-size="12" fill="#2d4b22">Oracle DB debt_process_starter</text>

  <!-- Mongo cylinder -->
  <path d="M610,232 v44 a100,11 0 0 0 200,0 v-44" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <ellipse cx="710" cy="232" rx="100" ry="11" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="710" y="262" text-anchor="middle" font-size="12" fill="#2d4b22">Mongo DB payment_templates</text>

  <!-- topic (message) -->
  <rect x="600" y="330" width="220" height="50" rx="4" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
  <path d="M600,334 L710,362 L820,334" fill="none" stroke="#9673a6" stroke-width="1.2"/>
  <text x="710" y="372" text-anchor="middle" font-size="11.5" fill="#4a2d55">payment.template.debt.process.start</text>

  <!-- flows -->
  <line x1="262" y1="238" x2="606" y2="140" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="262" y1="243" x2="606" y2="250" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="262" y1="248" x2="596" y2="352" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#a)"/>

  <g font-size="11.5" fill="#555" text-anchor="middle">
    <rect x="300" y="200" width="164" height="17" fill="#fbfbfd"/><text x="382" y="212">1.0 save batch metadata</text>
    <rect x="316" y="236" width="132" height="17" fill="#fbfbfd"/><text x="382" y="248">1.1 fetch templates</text>
    <rect x="330" y="278" width="96" height="17" fill="#fbfbfd"/><text x="378" y="290">1.2 publish</text>
  </g>

  <!-- legend -->
  <g font-size="12" fill="#5a5a63">
    <rect x="60" y="420" width="22" height="14" rx="3" fill="#dae8fc" stroke="#6c8ebf"/><text x="90" y="431">service</text>
    <rect x="170" y="420" width="22" height="14" rx="3" fill="#e1d5e7" stroke="#9673a6"/><text x="200" y="431">topic / queue</text>
    <ellipse cx="311" cy="427" rx="11" ry="7" fill="#d5e8d4" stroke="#82b366"/><text x="330" y="431">datastore</text>
    <rect x="430" y="420" width="22" height="14" rx="3" fill="#fff2cc" stroke="#d6b656" stroke-dasharray="3 2"/><text x="460" y="431">external (dashed)</text>
    <text x="600" y="431" fill="#9a9aa2">arrows glued · steps numbered in order</text>
  </g>
</svg>
